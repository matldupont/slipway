name: pr-body

# Its own workflow so it re-runs when the PR description is edited, not only on new commits:
# fixing the body is how this check is made green. The job name is the required status context.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: pr-body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changed files need the base commit
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr/body.md"
          node ci/checks/lib/gate-files.mjs "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/pr/body.changes.json"
          node ci/checks/meta/p1-pr-body.mjs "$RUNNER_TEMP/pr"
