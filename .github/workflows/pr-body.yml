name: pr-body

# Its own workflow so it re-runs when the PR description is edited, not only on new commits:
# fixing the body is how this check is made green. The job name is the required status context.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  # A running run is never cancelled: a cancelled run is shown as a failing check beside the one that passed. GitHub still
  # cancels a run waiting in the group when a newer one queues: the newer run replaces it, and the newest body is checked.
  cancel-in-progress: false

jobs:
  pr-body:
    name: pr-body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changed files need the base commit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # A re-run carries the stored event, so a draft-era run re-run after the pull request was marked ready would still
      # say draft: only a first attempt may read the draft flag, and a re-run is judged as ready.
      - name: Check the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DRAFT: ${{ github.run_attempt == 1 && github.event.pull_request.draft }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr"
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr/body.md"
          node ci/checks/lib/gate-files.mjs "$BASE_SHA" "$HEAD_SHA" "$DRAFT" > "$RUNNER_TEMP/pr/body.changes.json"
          node ci/checks/meta/p1-pr-body.mjs "$RUNNER_TEMP/pr" .
      # In slipway and every project (F-16 §10, D-051): the chatbot, placeholder and recap rules run on the body after P1;
      # warnings print and never fail. The Vale pin matches ci.yml's: scripts/prose.test.mjs fails if the two differ.
      - name: Install Vale at the pinned version, sha256 checked
        env:
          VALE_VERSION: 3.24.0
          VALE_SHA256: 867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214
        run: |
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/vale.tar.gz" "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/vale-bin"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/vale-bin" vale
          echo "$RUNNER_TEMP/vale-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vale-bin/vale" --version | grep -qx "vale version ${VALE_VERSION}"
      - name: Check the PR body for chatbot phrasing
        timeout-minutes: 5
        run: node ci/prose.mjs --body "$RUNNER_TEMP/pr/body.md"
