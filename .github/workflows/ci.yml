name: ci

# Both triggers, always. CI on pull_request only means a direct push to the deploy branch
# runs none of it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Zero-dependency checks: no install step, so a dependency can never break the harness
  # that proves the other gates.
  meta:
    name: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # slipway is told apart by its root commit; a shallow clone cannot show it (#123)
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Before pnpm runs anything: `pnpm run` and the install's lifecycle scripts put the repository's
      # node_modules/.bin first on PATH, so N1 runs here, with the runner's node, before a tracked program
      # there could stand in for node or a gate tool (#133).
      - name: Nothing under node_modules/ is tracked
        run: node ci/checks/meta/n1-node-modules.mjs .
      - run: pnpm meta

  verify:
    name: verify
    # slipway itself has no app, so verify is BROKEN there by design. Skip only on a repository marked as
    # a template; every project created from it is not one, and runs verify.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # slipway is told apart by its root commit; a shallow clone cannot show it (#123)
      # Before any install: with no app there is nothing to verify, and this says so (BROKEN, pointing at
      # BOOTSTRAP §1) instead of failing later on a missing lockfile. Needs no dependencies.
      - name: Require an app
        run: node ci/verify.mjs --plan
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Before pnpm runs anything: `pnpm run` and the install's lifecycle scripts put the repository's
      # node_modules/.bin first on PATH, so N1 runs here, with the runner's node, before a tracked program
      # there could stand in for node or a gate tool (#133).
      - name: Nothing under node_modules/ is tracked
        run: node ci/checks/meta/n1-node-modules.mjs .
      # `--frozen-lockfile` checks the lockfile against package.json, not where each package comes from: a
      # git repository, a tarball URL or a folder runs its install scripts like any other. LK1 fails one of
      # those unless ci/exceptions.yaml excuses it, and it runs before pnpm fetches anything (#138).
      - name: The lockfile resolves every package from the registry
        run: node ci/checks/meta/lk1-lockfile.mjs .
      - run: pnpm install --frozen-lockfile
      # What the project's tests need before verify (a database service, an env var) goes in
      # ci/before-verify.sh, the project's own file: never edit this workflow for it. It can append
      # `NAME=value` lines to "$GITHUB_ENV". With no such file, this step does nothing.
      - name: Project setup for tests
        run: if [ -f ci/before-verify.sh ]; then bash ci/before-verify.sh; fi
      - run: pnpm verify
