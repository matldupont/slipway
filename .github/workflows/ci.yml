name: ci

# Both triggers, always. CI on pull_request only means a direct push to the deploy branch
# runs none of it.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Zero-dependency checks: no install step, so a dependency can never break the harness
  # that proves the other gates.
  meta:
    name: meta
    runs-on: ubuntu-latest
    # pull-requests: read lets ID2 list the open pull requests; a job's permissions replace the workflow's, so
    # contents: read is restated.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # slipway is told apart by its root commit; a shallow clone cannot show it (#123)
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # ID2: no id this pull request adds is added by another open one (#478). First, before pnpm meta runs code the
      # pull request can change, which could write ID2's folder or its PATH. In the meta job, the check every project's
      # branch protection requires, so a red ID2 blocks the merge; the steps after it run unless the run is cancelled,
      # so a red or BROKEN ID2 never stops N1 and pnpm meta from reporting, and the job stays red. Other pull requests
      # are fetched as refs and diffed, never checked out; on a push it says it compared nothing.
      - name: No open pull request adds the same id
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node ci/checks/lib/open-pr-ids.mjs "$RUNNER_TEMP/id2" "$REPO" "$PR" "$BASE_SHA" "$HEAD_SHA"
          node ci/checks/meta/id2-open-prs.mjs "$RUNNER_TEMP/id2"
      # Before pnpm runs anything: `pnpm run` and the install's lifecycle scripts put the repository's
      # node_modules/.bin first on PATH, so N1 runs here, with the runner's node, before a tracked program
      # there could stand in for node or a gate tool (#133).
      - name: Nothing under node_modules/ is tracked
        if: ${{ !cancelled() }}
        run: node ci/checks/meta/n1-node-modules.mjs .
      - if: ${{ !cancelled() }}
        run: pnpm meta

  verify:
    name: verify
    # slipway itself has no app, so verify is BROKEN there by design. Skip only on a repository marked as
    # a template; every project created from it is not one, and runs verify.
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # slipway is told apart by its root commit; a shallow clone cannot show it (#123)
      # Before any install: with no app there is nothing to verify, and this says so (BROKEN, pointing at
      # BOOTSTRAP §1) instead of failing later on a missing lockfile. Needs no dependencies.
      - name: Require an app
        run: node ci/verify.mjs --plan
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # Before pnpm runs anything: `pnpm run` and the install's lifecycle scripts put the repository's
      # node_modules/.bin first on PATH, so N1 runs here, with the runner's node, before a tracked program
      # there could stand in for node or a gate tool (#133).
      - name: Nothing under node_modules/ is tracked
        run: node ci/checks/meta/n1-node-modules.mjs .
      # `--frozen-lockfile` checks the lockfile against package.json, not where each package comes from: a
      # git repository, a tarball URL or a folder runs its install scripts like any other. LK1 fails one of
      # those unless ci/exceptions.yaml excuses it, and it runs before pnpm fetches anything (#138).
      - name: The lockfile resolves every package from the registry
        run: node ci/checks/meta/lk1-lockfile.mjs .
      - run: pnpm install --frozen-lockfile
      # What the project's tests need before verify (a database service, an env var) goes in
      # ci/before-verify.sh, the project's own file: never edit this workflow for it. It can append
      # `NAME=value` lines to "$GITHUB_ENV". With no such file, this step does nothing.
      - name: Project setup for tests
        run: if [ -f ci/before-verify.sh ]; then bash ci/before-verify.sh; fi
      - run: pnpm verify

  # Vale is a binary, so the prose check is a job of its own: `meta` installs nothing (F-16 §8, D-004). It runs in slipway
  # and in every project (F-16 §10, D-051). The version and its sha256 are pinned here and in pr-body.yml;
  # scripts/prose.test.mjs fails if the two differ.
  prose:
    name: prose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VALE_VERSION: 3.24.0
      VALE_SHA256: 867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214
      # The first push of a new repository has no commit before it (`before` is all zeros), so its base is the commit
      # itself: the diff set is empty and the held set is still read. Any other base is passed as it is.
      PROSE_BASE: ${{ github.event.pull_request.base.sha || (github.event.before == '0000000000000000000000000000000000000000' && github.sha) || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the lines a change adds need the base commit
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install Vale at the pinned version, sha256 checked
        run: |
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/vale.tar.gz" "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          echo "${VALE_SHA256}  $RUNNER_TEMP/vale.tar.gz" | sha256sum --check -
          mkdir "$RUNNER_TEMP/vale-bin"
          tar -xzf "$RUNNER_TEMP/vale.tar.gz" -C "$RUNNER_TEMP/vale-bin" vale
          echo "$RUNNER_TEMP/vale-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vale-bin/vale" --version | grep -qx "vale version ${VALE_VERSION}"
      # Before pnpm runs anything: `pnpm run` puts the repository's node_modules/.bin first on PATH, so N1 runs here, with the
      # runner's node, before a tracked program there could stand in for `vale` (#133).
      - name: Nothing under node_modules/ is tracked
        run: node ci/checks/meta/n1-node-modules.mjs .
      - run: pnpm check:prose
      # scripts/ never ships to a project (dev/ownership.yaml), so its tests run in slipway only.
      - if: ${{ github.event.repository.is_template }}
        run: |
          node scripts/prose.test.mjs
          node scripts/prose-job.test.mjs
