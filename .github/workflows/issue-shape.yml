name: issue-shape

# The web form enforces shape; issues created through the API (gh issue create, agents)
# bypass it. This labels them, and says in a comment on the issue what is missing, instead of
# letting them in silently. The check's own output stays in the Actions log, which an issue's
# author never opens; the comment is where they will read it.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-shape-${{ github.event.issue.number }}

jobs:
  shape:
    name: shape
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the issue body
        id: shape
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p "$RUNNER_TEMP/issue"
          printf '%s\n' "$ISSUE_BODY" > "$RUNNER_TEMP/issue/body.md"
          node ci/checks/meta/i1-issue-shape.mjs "$RUNNER_TEMP/issue" > "$RUNNER_TEMP/issue/report.txt" || status=$?
          cat "$RUNNER_TEMP/issue/report.txt"
          exit "${status:-0}"
      - name: Label an issue that fails, and say what is missing
        if: failure() && steps.shape.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUMBER" --repo "$REPO" --add-label needs-shape
          # I1's finding lines read `I1: <file>#<key>: <sentence>`; the comment keeps the sentence.
          sed -n 's/^I1: [^ :]*#[^ :]*: //p' "$RUNNER_TEMP/issue/report.txt" > "$RUNNER_TEMP/issue/findings.txt"
          [ -s "$RUNNER_TEMP/issue/findings.txt" ] || exit 0
          {
            echo '<!-- issue-shape -->'
            echo 'This issue is labelled `needs-shape`. Edit it to fix:'
            echo
            # a quoted criterion may hold an @mention; a zero-width space keeps the bot from notifying it
            sed -e 's/@/@\xe2\x80\x8b/g' -e 's/^/- /' "$RUNNER_TEMP/issue/findings.txt"
            echo
            echo 'This comment updates when you edit the issue, and goes away once it passes.'
          } > "$RUNNER_TEMP/issue/comment.md"
          id=$(gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- issue-shape -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" --field body=@"$RUNNER_TEMP/issue/comment.md" > /dev/null
          else
            gh issue comment "$NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/issue/comment.md"
          fi
      - name: Clear the label and the comment once it passes
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$NUMBER" --repo "$REPO" --remove-label needs-shape || true
          gh api "repos/$REPO/issues/$NUMBER/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- issue-shape -->"))) | .id' |
            while read -r id; do gh api --method DELETE "repos/$REPO/issues/comments/$id"; done
