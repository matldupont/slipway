# Vale's config for slipway's prose check (F-16 §8, dev/features/plain-language.md). Read by ci/prose.mjs only.
# StylesPath is read from this file's folder; the rules are ci/prose/Slipway/*.yml. ci/prose.mjs copies every file under a
# `.txt` name, so Vale reads plain text: no markdown parsing, no comment directive, no character reference.
StylesPath = ci/prose
MinAlertLevel = warning

[*.txt]
BasedOnStyles = Slipway

# A template and a seeded file keep their placeholders by design (the `seeded` class in dev/ownership.yaml).
[{*TEMPLATE.md.txt,*_template.md.txt,docs/PRD.md.txt,docs/product/FRAME.md.txt,docs/milestones/M1-walking-skeleton.md.txt}]
Slipway.Placeholder = NO
