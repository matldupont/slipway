# Vale's config for slipway's prose check (F-16 §8, dev/features/plain-language.md). Read by ci/prose.mjs only.
# StylesPath is read from this file's folder; the rules are ci/prose/Slipway/*.yml.
StylesPath = ci/prose
MinAlertLevel = warning

[*.md]
BasedOnStyles = Slipway

# A template and a seeded file keep their placeholders by design (the `seeded` class in dev/ownership.yaml).
[{*TEMPLATE.md,*_template.md,docs/PRD.md,docs/product/FRAME.md,docs/milestones/M1-walking-skeleton.md}]
Slipway.Placeholder = NO
