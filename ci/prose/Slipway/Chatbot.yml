extends: existence
message: "Chatbot phrasing: delete '%s'. Start with what the reader does next, or what changed."
level: error
scope: raw
ignorecase: true
nonword: true
tokens:
  - 'I\s+hope\s+this\s+helps'
  - 'Great\s+question'
  - 'Certainly!'
  - 'As\s+an\s+AI'
  - 'Let\s+me\s+know\s+if'
  - 'Happy\s+to\s+help'
  - "I'd\\s+be\\s+happy\\s+to"
  - 'Absolutely!'
  - 'Of\s+course!'
