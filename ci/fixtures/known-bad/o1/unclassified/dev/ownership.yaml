# Traps, each a finding in expected.json or deliberately not one:
#   ci/.hidden/kept.md   a dot-segment under `ci/**` — classified (path.matchesGlob would miss it)
#   tpl/TEMPLATE.md      `**` matching zero segments, the only glob that reaches it — classified
#   docs/sub/nested.md   `*` never crosses `/` — unclassified
#   nested/dev/kept.md   `dev/**` is anchored at the root: a nested dev/ is not internal — unclassified
#   stray.md             no glob at all — unclassified
#   .gitignore           not on disk here, but new-project always writes one — unclassified
paths:
  - glob: dev/**
    class: internal
  - glob: expected.json
    class: internal
  - glob: '**/.DS_Store'
    class: internal
  - glob: ci/**
    class: managed
  - glob: tpl/**/TEMPLATE.md
    class: managed
  - glob: docs/*.md
    class: seeded
