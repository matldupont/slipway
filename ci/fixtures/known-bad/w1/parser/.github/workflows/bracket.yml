name: bracket
# A list over several lines whose closing bracket sits at its key's indentation. GitHub's reader is believed to
# accept it; the parser does not, so the file is unread, with its line and how to write it.
on: pull_request
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [
          22,
          24
        ]
    steps:
      - run: pnpm test:bracket
